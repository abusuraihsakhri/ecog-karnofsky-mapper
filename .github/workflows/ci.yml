name: Tests and packaging

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/ecog-wheels
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          script = re.search(r"<script>(.*?)</script>", html, re.DOTALL)
          assert script is not None
          Path("/tmp/ecog-web.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/ecog-web.js
