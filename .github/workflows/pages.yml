name: Deploy standalone application to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          if grep -q "fetch('/api/audit')" _site/index.html; then
            echo "Unsupported backend dependency found in static site"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site over HTTPS
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen

          url = os.environ["LIVE_URL"]
          for attempt in range(24):
              try:
                  request = Request(url, headers={"User-Agent": "ecog-kps-pages-smoke-test"})
                  with urlopen(request, timeout=20) as response:
                      html = response.read().decode("utf-8")
                      assert response.status == 200, response.status
                  assert "<title>ECOG–Karnofsky Performance Status Mapper</title>" in html
                  assert "const GROUPS = [[90,100],[70,80],[50,60],[30,40],[10,20],[0]];" in html
                  assert 'id="convert"' in html
                  print("Published application serves the expected interactive source:", url)
                  break
              except Exception:
                  if attempt == 23:
                      raise
                  time.sleep(5)
          PY

      - name: Exercise published UI in Chromium
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              page.goto(os.environ["LIVE_URL"], wait_until="load")
              assert "ECOG 2 · KPS 50 or 60" in page.locator("#result").inner_text()
              page.locator("#scale").select_option("kps")
              page.locator("#score").select_option("40")
              assert "ECOG 3 · KPS 30 or 40" in page.locator("#result").inner_text()
              page.locator("#file").set_input_files({
                  "name": "test.csv",
                  "mimeType": "text/csv",
                  "buffer": b"case,ecog,kps\ncase-one,1,\ncase-two,,40\n",
              })
              with page.expect_download() as download_event:
                  page.locator("#convert").click()
              download = download_event.value
              assert download.suggested_filename == "ecog-kps-mapped.csv"
              assert "2 rows validated" in page.locator("#batchStatus").inner_text()
              with tempfile.TemporaryDirectory() as folder:
                  output = Path(folder) / "mapped.csv"
                  download.save_as(output)
                  csv_data = output.read_text(encoding="utf-8")
                  assert "70|80" in csv_data and "30|40" in csv_data
              assert not errors, errors
              print("Published ECOG/KPS selection and CSV download passed in Chromium.")
              browser.close()
          PY
