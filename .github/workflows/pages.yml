name: Deploy standalone application to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          if grep -q "fetch('/api/audit')" _site/index.html; then
            echo "Unsupported backend dependency found in static site"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site over HTTPS
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen

          url = os.environ["LIVE_URL"]
          for attempt in range(24):
              try:
                  request = Request(url, headers={"User-Agent": "ecog-kps-pages-smoke-test"})
                  with urlopen(request, timeout=20) as response:
                      html = response.read().decode("utf-8")
                      assert response.status == 200, response.status
                  assert "<title>ECOG–Karnofsky Performance Status Mapper</title>" in html
                  assert "const GROUPS = [[90,100],[70,80],[50,60],[30,40],[10,20],[0]];" in html
                  assert 'id="convert"' in html
                  print("Published application serves the expected interactive source:", url)
                  break
              except Exception:
                  if attempt == 23:
                      raise
                  time.sleep(5)
          PY
